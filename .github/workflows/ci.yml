name: fimrf-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Byte-compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Import package smoke test
        run: python -c "import fimrf; print(fimrf.__version__ if hasattr(fimrf, '__version__') else 'fimrf import ok')"
      - name: Generate cached public-compatible samples
        run: python scripts/create_public_compatible_samples.py
      - name: Run full pipeline
        run: python scripts/run_pipeline.py
      - name: Run small-data validation
        run: python scripts/run_small_data_validation.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify required artifacts
        run: python scripts/verify_required_artifacts.py
